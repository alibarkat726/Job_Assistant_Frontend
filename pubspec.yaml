name: job_assistant
description: Job Assistant AI agent platform — Flutter frontend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8

  # State management (Riverpod 3 + annotation codegen)
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7

  # Networking — Dio chosen for interceptor support (auth attach, 401 refresh/retry)
  dio: 5.11.1

  # Routing
  go_router: 18.0.1

  # Storage
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.3

  # Theming / typography
  google_fonts: 6.2.1

  # Models / serialization
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0

  equatable: 2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: 2.5.4
  riverpod_generator: 4.0.9
  freezed: 3.2.3
  json_serializable: 6.9.5
  mocktail: 1.0.4
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true
