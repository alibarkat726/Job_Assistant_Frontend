name: job_assistant
description: Job Assistant AI agent platform — Flutter frontend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8

  # State management (Riverpod 3 + annotation codegen)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking — Dio chosen for interceptor support (auth attach, 401 refresh/retry)
  dio: ^5.7.0

  # Routing
  go_router: ^14.3.0

  # Storage & Files
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  path: ^1.9.0

  # Theming / typography / icons
  google_fonts: ^6.2.1
  flutter_tabler_icons: ^1.36.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: 1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
